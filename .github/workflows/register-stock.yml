name: Register stock to watchlist

# アプリの「サーバーに登録」ボタンが作成する Issue（タイトルが [register] で始まる）を検知し、
# 本文中の ```stock ブロックの銘柄を swing/watchlist.json に追記して自動コミットする。
# 反映後は 5分ごとの Deploy スケジュールが Yahoo から株価を取得して表示に載る。
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  register:
    # リポジトリ所有者が作成し、タイトルが [register] で始まる Issue のみ処理（他者の Issue は無視）
    if: startsWith(github.event.issue.title, '[register]') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update watchlist.json
        id: upd
        env:
          BODY: ${{ github.event.issue.body }}
        run: node swing/register-stock.mjs

      - name: Commit watchlist
        if: steps.upd.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add swing/watchlist.json
          git commit -m "銘柄をwatchlistに登録: ${{ steps.upd.outputs.code }}"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        env:
          MSG: ${{ steps.upd.outputs.message }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: process.env.MSG || '処理しました。'
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed'
            });
